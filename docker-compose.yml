version: '3.9'

services:
  scrapdealer-api:
    image: ghcr.io/mhaz2000/scrap-dealer:latest
    container_name: scrapdealer-api
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__SQL=Server=sqlserver;Database=ScrapDealerDB;User Id=sa;Password=Scr@pDe@1er!31372;TrustServerCertificate=True;
      - Redis__ConnectinString=redis:6379,password=123456
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=admin
      - Minio__SecretKey=admin123
      - Minio__BucketName=filestorage
      - Minio__UseSSL=false
    depends_on:
      - sqlserver
      - redis
      - minio

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: scrapdealer-sql
    environment:
      SA_PASSWORD: "Scr@pDe@1er!31372"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  redis:
    image: docker.arvancloud.ir/redis:7.0
    container_name: scrapdealer-redis
    command: ["redis-server", "--requirepass", "123456"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2023-11-01T01-57-10Z-cpuv1
    container_name: scrapdealer-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    ports:
      - "9000:9000"
    command: server /data
    volumes:
      - minio_data:/data

  nginx:
    image: docker.arvancloud.ir/nginx:alpine
    container_name: scrapdealer-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - scrapdealer-api
      - minio

  sqlpad:
    image: docker.arvancloud.ir/sqlpad/sqlpad:latest
    container_name: scrapdealer-sqlpad
    ports:
      - "3030:3000"
    environment:
      SQLPAD_ADMIN: "admin"
      SQLPAD_ADMIN_PASSWORD: "admin123"
      PUBLIC_PATH: "/sqlpad"
    depends_on:
      - sqlserver
    volumes:
      - sqlpad_data:/var/lib/sqlpad

volumes:
  sql_data:
  redis_data:
  minio_data:
  sqlpad_data:
